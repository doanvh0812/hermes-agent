# Profile config for the Zalo support bot.
#
# Written minimal on purpose. Copying the root config.yaml drags in the
# terminal backend and every toolset — which is exactly what this profile
# exists to remove. An agent with a terminal can reach Odoo over XML-RPC
# directly, bypassing every MCP-level restriction below.
#
# Install to: $HERMES_HOME/profiles/zalo-bot/config.yaml
#
# NOTE: a profile inherits NOTHING from the root one — see DEPLOY.md
# "What a profile does and does not inherit" for model provider, API keys,
# env vars and state that must be carried over by hand.

model:
  default: max
  provider: custom:9router-claude     # must match an entry below
custom_providers:
  - name: 9router-claude
    base_url: "http://llm-host/v1"
    api_key: "sk-LITERAL-KEY"         # ${VAR} is NOT interpolated

terminal:
  enabled: false        # belt. platform_toolsets below is the suspenders.

# toolsets.enabled: false does NOT disable anything — Hermes reads
# platform_toolsets instead (verified: a terminal tool kept running under it).
# An MCP server is listed by the bare key it has under mcp_servers: below —
# `odoo`. A decorated form (mcp-odoo, mcp_odoo) matches no server and is not a
# toolset either, so the platform silently ends up with zero Odoo tools: the
# server still starts and the gateway still logs it, but the agent can only
# reply that it cannot look anything up.
platform_toolsets:
  zalo: [file, vision, clarify, session_search, memory, skills, odoo]

agent:
  # Applied last, subtracting from what survived — so listing `odoo` here
  # removes the MCP server enabled above. Only silence what you want gone.
  disabled_toolsets: [kanban]
  # A lookup answers in a handful of tool calls. The default of 90 lets a
  # tool-loop (the model re-invoking the same search instead of answering)
  # burn minutes and tokens before anything stops it — the "⏳ Working — 3 min"
  # heartbeat is usually that loop, not useful work.
  max_turns: 20

plugins:
  enabled: []

# Background-review notices in chat. The agent's self-improvement pass writes
# memory and patches skills between turns, then announces it:
#
#   💾 Self-improvement review: Memory updated · User profile updated
#   💾 Self-improvement review: Skill 'odoo-lookup-diagnostics' created. · …
#
# That is the agent talking about its own housekeeping, delivered into a
# business chat where staff are asking about invoices. Turn it off for a
# user-facing bot. `off` suppresses only the chat delivery — the same line
# still goes to stdout, so logs/gateway.log keeps the record of which skill
# was patched and when.
display:
  # MUST be top level. config_defaults.py advertises a per-platform override
  # (display.platforms.<platform>.memory_notifications), but the gateway reads
  # user_config["display"]["memory_notifications"] directly in gateway/run.py
  # — it does not route this key through gateway/display_config.py, which
  # never mentions it. Setting it per platform has no effect and reports no
  # error.
  #
  # Quoted on purpose: bare `off` is YAML boolean false. The gateway coerces
  # bools, so both happen to work, but the string matches the documented
  # values (off | on | verbose) and does not lean on that coercion.
  memory_notifications: "off"

  # Suppresses, when a user messages while the bot is mid-turn:
  #
  #   ⚡ Interrupting current task (iteration 1/20). I'll respond to your
  #      message shortly.
  #
  # Staff asking about an invoice do not need to know which iteration the
  # agent is on. Their message is still processed exactly as before — only
  # the acknowledgement is dropped.
  #
  # Read ONCE at gateway startup and exported as
  # HERMES_GATEWAY_BUSY_ACK_ENABLED (gateway/run.py), not re-read per turn, so
  # changing this REQUIRES a gateway restart — unlike memory_notifications
  # above, which rides the mtime-keyed config cache.
  #
  # display.busy_ack_detail only trims the "(iteration 1/20)" part; it does not
  # stop the message.
  busy_ack_enabled: false

# Context compaction. The defaults look active and are not: `enabled: true`
# with the percentage threshold means compaction never fires on a
# large-window model, so a long chat thread grows until every turn re-reads
# the whole transcript. Measured on this deployment: one 203-message DM
# reached 171K tokens and accounted for $11.86 of $15.48 total spend, while
# `compacted=1` counted 0 messages out of 389 across 9 sessions.
compression:
  # lean, not the legacy default. The summary then carries every real user
  # message verbatim (they override any paraphrase of them), a harvested
  # index of identifiers, per-chunk digests instead of one flat summary
  # (upstream's own eval put flat-summary recall at ~33%), tool results
  # demoted to stubs with recovery pointers rather than deleted, and a footer
  # naming the exact session_search call that reaches the compacted region —
  # every pre-compaction message stays in state.db, so compaction is deferred
  # retrieval rather than loss. Keep `session_search` in platform_toolsets or
  # that recovery pointer names a tool the agent does not have.
  #
  # legacy also keeps a verbatim tail of 0.20 x context window: 210K tokens on
  # a 1.05M model, larger than any session this bot has ever had, so even a
  # triggered compaction would reclaim almost nothing. lean clamps the tail to
  # 2.5%, 10K-25K.
  tail_mode: lean

  # Absolute, not the 0.5 fraction. 0.5 x 1.05M = 525K — three times the
  # longest session on record. An absolute figure also survives a model
  # change, which a percentage does not: switching to a wider window silently
  # raises the trigger point.
  #
  # 80K sits well above a fresh session's floor (~20K: SOUL.md, tool schemas,
  # loaded skills), so ordinary short lookups are untouched.
  threshold_tokens: 80000

  # Length alone misses the shape a chat bot actually has: a thread goes quiet
  # for days, then someone replies into it and the whole history is re-read.
  idle_compact_after_seconds: 7200

mcp_servers:
  odoo:
    command: uvx
    args: [odoo-mcp]
    env:
      ODOO_URL: "https://odoo.example.com"
      ODOO_DB: "dbname"
      ODOO_USERNAME: "bot_readonly"
      ODOO_PASSWORD: "LITERAL-API-KEY"
      ODOO_TRANSPORT: "xmlrpc"          # json2 for Odoo 19+

      # 7 read tools + execute_method. Allowlist, so tools added upstream stay off.
      ODOO_MCP_TOOLS_INCLUDE: "search_records,read_record,aggregate_records,get_model_fields,build_domain,receivable_payable_aging,accounting_health_summary,execute_method"
      ODOO_MCP_ALLOW_UNKNOWN_METHODS: "0"
      # ODOO_MCP_ENABLE_WRITES intentionally unset.
      #
      # The methods the agent may reach through execute_method. Three, not
      # one: find_billable_line only reads, record_transfer_receipt files a
      # pending receipt, but create_invoice_and_payment issues and POSTS an
      # invoice and records its payment — real money in the books, with no
      # approval step behind it. The skill and the SOUL guardrail both gate
      # it on the sender's own confirmation; this line is what makes it
      # reachable at all.
      #
      # execute_method blocks create/write/unlink outright and refuses
      # side-effect methods unless named here. It does NOT refuse methods
      # whose NAME looks read-only (search_read, read, get_*) — those reach
      # any model and skip field_policy.json entirely, because the policy is
      # enforced in tools_read.py and execute_method is not there. Run
      # deploy/patches/fix-execute-method-field-acl.py to close that; see
      # DEPLOY.md, "Enabling execute_method punches a hole in the field ACL".
      ODOO_MCP_ALLOWED_SIDE_EFFECT_METHODS: "vni.transfer.receipt.record_transfer_receipt,vni.transfer.receipt.find_billable_line,vni.transfer.receipt.create_invoice_and_payment"

      ODOO_MCP_FIELD_POLICY_FILE: "/home/USER/.hermes/odoo-mcp/field_policy.json"
      ODOO_MCP_INSTRUCTIONS_FILE: "/home/USER/.hermes/odoo-mcp/instructions.txt"

      ODOO_MCP_RATE_LIMIT_MODE: "block"
      ODOO_MCP_RATE_LIMIT_WINDOW: "60"
      ODOO_MCP_RATE_LIMIT_MAX_CALLS: "30"

      ODOO_LOCALE: "vi_VN"
