# Zalo bot logs.  Install to /etc/logrotate.d/hermes-zalo with the
# placeholders substituted -- deploy/migrate/install-services.sh renders it.
#
# copytruncate is required and not a style choice: the gateway (audit.jsonl)
# and the node bridge (bridge.log) both hold their fd open and neither reopens
# on SIGHUP, so a plain rotate leaves them writing into the renamed file and
# the live log silently stops growing.
#
# Paths are PROFILE-scoped. An earlier version of this file pointed at
# $HERMES_HOME/zalo/, which is the default profile's directory -- it would
# have rotated nothing on this deployment while looking correctly installed.

__PROFILE_HOME__/zalo/audit.jsonl
{
    weekly
    rotate 52
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su __USER__ __GROUP__
}

__PROFILE_HOME__/logs/*.log
__PROFILE_HOME__/logs/*.err.log
{
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su __USER__ __GROUP__
}
