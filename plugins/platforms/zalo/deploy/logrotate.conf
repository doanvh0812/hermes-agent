# Zalo adapter logs.
# copytruncate is required: the gateway (audit.jsonl) and the node bridge
# (bridge.log) both hold their fd open and neither reopens on SIGHUP.
/home/USER/.hermes/zalo/audit.jsonl
/home/USER/.hermes/zalo/bridge.log
{
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su USER USER
}
