<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · Quản trị bot Zalo</title>
<style>
  :root{
    --paper:#F5F7F5; --surface:#fff; --line:#D3D9D3; --text:#17201C;
    --text-2:#52605A; --brass:#8A6316; --risk:#8C2A26; --risk-bg:#F6E3E1;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper:#101613; --surface:#161E1A; --line:#2C3A34; --text:#E6ECE8;
    --text-2:#A3B1AA; --brass:#D4A843; --risk:#E08A82; --risk-bg:#351B19;
  }}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);
       color:var(--text);font:16px/1.6 "Segoe UI",system-ui,sans-serif;padding:1.5rem}
  form{background:var(--surface);border:1px solid var(--line);border-radius:6px;
       padding:2rem;width:min(24rem,100%);display:flex;flex-direction:column;gap:1rem}
  h1{margin:0;font-size:1.2rem;line-height:1.3}
  p.sub{margin:0;font-size:.88rem;color:var(--text-2)}
  label{font-size:.82rem;color:var(--text-2)}
  input{width:100%;padding:.6rem .7rem;font:inherit;color:var(--text);
        background:var(--paper);border:1px solid var(--line);border-radius:4px}
  input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
  button{padding:.65rem;font:inherit;font-weight:600;color:#fff;background:var(--brass);
         border:0;border-radius:4px;cursor:pointer}
  .err{background:var(--risk-bg);color:var(--risk);font-size:.85rem;
       padding:.6rem .75rem;border-radius:4px}
</style>
</head>
<body>
  <form method="post" action="/login">
    <div>
      <h1>Quản trị bot Zalo</h1>
      <p class="sub">Trang này cấp quyền dùng bot và khởi động đăng nhập Zalo.</p>
    </div>
    {% if loi %}<div class="err">{{ loi }}</div>{% endif %}
    <div>
      <label for="mk">Mật khẩu</label>
      <input id="mk" name="matkhau" type="password" autocomplete="current-password"
             autofocus required>
    </div>
    <button type="submit">Đăng nhập</button>
  </form>
</body>
</html>
